# Alcove CI — gates from M0, never bolted on later (Phase 2 / principle 1).
#
# Two jobs on purpose: `go` is fast and gates every push; `image` gates what would
# actually ship. The constraint guards run via scripts/guards.sh, the same script the
# Makefile and bootstrap.ps1 call, so a guard cannot pass locally and mean something
# different here (principle 4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build · test · guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

      # The race detector runs here and not on the Windows dev box (no C toolchain
      # there); this job is the only place it actually runs.
      - name: Test
        run: go test -race ./...

      - name: Constraint guards
        run: bash scripts/guards.sh all

      # Static analysis of the module graph for reachable known vulnerabilities.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Dependency and licence gate (checklist 00, ADR D-2). Also part of `guards.sh all`;
      # run by name so it fails as its own step. Every third-party module must be listed in
      # scripts/dependencies.allow with an AGPL-compatible licence.
      - name: Dependency and licence gate
        run: bash scripts/guards.sh licenses

  image:
    name: image · least-privilege · scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t alcove:ci .

      # Hard constraint 9. Asserted against the built image rather than trusted from
      # the base image's default.
      - name: 'Guard: runs as non-root'
        run: |
          U=$(docker inspect --format '{{.Config.User}}' alcove:ci)
          if [ -z "$U" ] || [ "$U" = "root" ] || [ "$U" = "0" ]; then
            echo "::error::image runs as root"; exit 1
          fi
          echo "image user: $U"

      - name: 'Guard: base images pinned by digest'
        run: bash scripts/guards.sh digest-pin

      # Hard constraints 2 and 9 (N10): only the intended port, no host network, a
      # read-only rootfs and resource limits present.
      - name: 'Guard: compose exposure and limits'
        run: |
          cp .env.example .env
          sed -i 's|^ALCOVE_DATA_PATH=.*|ALCOVE_DATA_PATH=/tmp/ci-data|' .env
          docker compose config -q
          cfg=$(docker compose config)
          echo "$cfg" | grep -q 'network_mode: *host' && { echo "::error::host network"; exit 1; }
          echo "$cfg" | grep -q 'read_only: *true'    || { echo "::error::rootfs not read-only"; exit 1; }
          echo "$cfg" | grep -q 'memory:'             || { echo "::error::no memory limit"; exit 1; }
          published=$(echo "$cfg" | grep -c 'published:')
          if [ "$published" -ne 1 ]; then
            echo "::error::expected exactly 1 published port, found $published"; exit 1
          fi
          rm -f .env
          echo "compose exposure OK"

      # Run the shipped image the way an operator would and prove the M2a promises (N10, N2):
      # a key is made deliberately and the server never makes one, it starts unattended with a
      # plain key, it refuses to start without a key / with the key inside the data directory /
      # with the wrong key, it seals ciphertext only, it survives a restart, and it stops cleanly.
      - name: 'Smoke: key, unattended start, refusals, restart, clean stop'
        run: |
          set -eu
          W=$(mktemp -d)
          mkdir -p "$W/keys" "$W/keys2" "$W/data"
          chmod 777 "$W/keys" "$W/keys2" "$W/data"
          IMG=alcove:ci
          RUNFLAGS="--read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:mode=1777,noexec,nosuid,nodev"

          # 1. The operator makes keys deliberately (the server never does).
          docker run --rm $RUNFLAGS -v "$W/keys:/keys" $IMG keygen -out /keys/alcove.key
          docker run --rm $RUNFLAGS -v "$W/keys2:/keys" $IMG keygen -out /keys/other.key
          docker run --rm $RUNFLAGS -v "$W/keys:/keys:ro" $IMG keycheck -file /keys/alcove.key

          # 2. No key: refuses, and says how to fix it. Nothing is created.
          if out=$(docker run --rm $RUNFLAGS -v "$W/data:/data" $IMG 2>&1); then
            echo "::error::started without a key"; exit 1
          fi
          echo "$out" | grep -q "alcove keygen" || { echo "$out"; echo "::error::no keygen hint"; exit 1; }
          [ -z "$(ls -A "$W/data")" ] || { ls -la "$W/data"; echo "::error::a refused start left files"; exit 1; }

          # 3. Key inside the data directory: refuses (before it even reads the key).
          cp "$W/keys/alcove.key" "$W/data/alcove.key"
          if out=$(docker run --rm $RUNFLAGS -v "$W/data:/data" -e ALCOVE_KEY_FILE=/data/alcove.key $IMG 2>&1); then
            echo "::error::started with the key inside the data directory"; exit 1
          fi
          echo "$out" | grep -q "inside" || { echo "$out"; echo "::error::wrong refusal reason"; exit 1; }
          rm -f "$W/data/alcove.key"

          # 4. A plain key starts unattended and answers /healthz as unlocked.
          start() {
            docker run -d --name alcove-ci -p 18080:8080 $RUNFLAGS \
              -v "$1:/run/keys/alcove.key:ro" -v "$W/data:/data" $IMG >/dev/null
          }
          wait_health() {
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18080/healthz 2>/dev/null; then echo; return 0; fi
              sleep 1
            done
            docker logs alcove-ci || true; return 1
          }
          start "$W/keys/alcove.key"
          out=$(wait_health) || { echo "::error::no /healthz"; exit 1; }
          echo "$out" | grep -q '"state":"unlocked"' || { echo "$out"; echo "::error::not unlocked unattended"; exit 1; }

          # 5. Only ciphertext on the data volume: no SQLite header, no JSON other than the manifest.
          docker stop -t 15 alcove-ci >/dev/null
          docker logs alcove-ci 2>&1 | grep -q 'shutdown complete' || { docker logs alcove-ci; echo "::error::no clean shutdown"; exit 1; }
          docker rm alcove-ci >/dev/null
          test -f "$W/data/manifest.json" && test -f "$W/data/alcove.sealed" || { ls -la "$W/data"; echo "::error::no sealed store"; exit 1; }
          if grep -rl "SQLite format 3" "$W/data" >/dev/null 2>&1; then echo "::error::plaintext database on the data volume"; exit 1; fi

          # 6. Restart: same data, same key, nothing typed.
          start "$W/keys/alcove.key"
          wait_health >/dev/null || { echo "::error::no /healthz after restart"; exit 1; }
          docker stop -t 15 alcove-ci >/dev/null; docker rm alcove-ci >/dev/null

          # 7. A different key against that data: refuses cleanly and leaves the data alone.
          before=$(sha256sum "$W/data/alcove.sealed" | cut -d' ' -f1)
          if out=$(docker run --rm $RUNFLAGS -v "$W/keys2/other.key:/run/keys/alcove.key:ro" -v "$W/data:/data" $IMG 2>&1); then
            echo "::error::started with the wrong key"; exit 1
          fi
          echo "$out" | grep -qi "unseal failed\|wrong key" || { echo "$out"; echo "::error::wrong-key message"; exit 1; }
          after=$(sha256sum "$W/data/alcove.sealed" | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo "::error::a wrong key changed the sealed data"; exit 1; }
          echo "smoke OK"

      # Secrets scan matters as much as CVEs: the image must never carry key material
      # (hard constraint 4).
      - name: Trivy — vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alcove:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret
