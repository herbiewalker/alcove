# Alcove release: gates, build once by digest, scan, tag, publish.
#
# Triggered only by a version tag pushed by scripts/release.sh (the tag is the last
# step of a release, never a manual act). The version comes from the tag; there is no
# version file.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  gates:
    name: gates (test · guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash scripts/guards.sh all

  publish:
    name: build · scan · tag
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push to GHCR
      id-token: write      # build provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history and tags, for the two checks below

      # A tag is only a release if it points at reviewed history. Anyone with write
      # access can push a tag from any branch; refuse unless the commit is on main.
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; refusing to publish"; exit 1
          fi

      - name: Derive version
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Only the highest release tag may move :stable, so re-tagging an old
          # version can never silently downgrade everyone following :stable.
          highest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "move_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$GITHUB_REF_NAME is not the highest tag ($highest); :stable will not move"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build ONCE. The image is pushed by digest only (no tag), then the very same
      # digest is guarded and scanned, and only a clean digest gets the version and
      # :stable tags below. A vulnerable or secret-bearing image never carries a tag
      # anyone pulls.
      - name: Build and push (by digest, untagged)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: 'Guard: runs as non-root'
        run: |
          docker pull "$IMAGE@${{ steps.push.outputs.digest }}"
          U=$(docker inspect --format '{{.Config.User}}' "$IMAGE@${{ steps.push.outputs.digest }}")
          if [ -z "$U" ] || [ "$U" = "root" ] || [ "$U" = "0" ]; then
            echo "::error::image runs as root"; exit 1
          fi

      # Every third-party action in this workflow is pinned to a commit, not a moving tag: this job holds packages:write,
      # contents:write and id-token:write.
      - name: Trivy — vulnerabilities and secrets (the digest that will be tagged)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Tag the scanned digest
        run: |
          tags="-t $IMAGE:${{ steps.v.outputs.version }}"
          if [ "${{ steps.v.outputs.move_stable }}" = "true" ]; then tags="$tags -t $IMAGE:stable"; fi
          docker buildx imagetools create $tags "$IMAGE@${{ steps.push.outputs.digest }}"

      # Provenance attestations need a public repo; on a private repo this step would
      # fail after the tags were already applied.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Alcove ${GITHUB_REF_NAME}" \
            --notes "Image: \`${IMAGE}:${{ steps.v.outputs.version }}\` (digest \`${{ steps.push.outputs.digest }}\`). See CHANGELOG.md."
